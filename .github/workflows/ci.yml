name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "**.md"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install V
        uses: vlang/setup-v@v1.7

      - name: Check formatting
        run: v fmt -c .

      - name: Run tests
        run: v -nocache test .
