name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install V
        uses: vlang/v-action@v1

      - name: Check formatting
        run: v fmt -c .

      - name: Run tests
        run: v test .
